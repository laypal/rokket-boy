<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<style>
  /* ── Rökket Boy shell ─────────────────────────────────────────────── */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    background:#17131f;
    background-image: radial-gradient(ellipse at 50% 20%, #241c33 0%, #17131f 70%);
    display:flex; align-items:center; justify-content:center;
    font-family: monospace;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #shell {
    --body:#3b3548; --body-hi:#4c4560; --body-lo:#2a2536;
    background:linear-gradient(160deg, var(--body-hi) 0%, var(--body) 40%, var(--body-lo) 100%);
    border-radius:14px 14px 46px 14px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.12), inset 0 -3px 0 rgba(0,0,0,.35), 0 18px 50px rgba(0,0,0,.6);
    padding:14px 16px 20px;
    width:min(420px, 100vw - 12px);
    max-height:calc(100dvh - 8px);
    display:flex; flex-direction:column;
  }
  /* screen bezel */
  #bezel {
    background:linear-gradient(180deg,#211d2c,#16121f);
    border-radius:10px 10px 30px 10px;
    padding:16px 24px 12px;
    box-shadow: inset 0 3px 8px rgba(0,0,0,.7), inset 0 -1px 0 rgba(255,255,255,.06);
  }
  #bezel-top {
    display:flex; align-items:center; gap:8px;
    margin-bottom:8px;
  }
  #bezel-line { flex:1; height:3px; border-top:1px solid #b8459c; border-bottom:1px solid #4e9aa8; }
  #bezel-top span { font-size:8px; letter-spacing:1px; color:#8d84a3; white-space:nowrap; }
  #screenwrap { display:flex; align-items:center; gap:10px; }
  #led-col { display:flex; flex-direction:column; align-items:center; gap:4px; width:26px; flex:none; }
  #led { width:8px; height:8px; border-radius:50%; background:#3a1220; box-shadow:0 0 2px #000 inset; transition:background .3s, box-shadow .3s; }
  #led.on { background:#ff2d55; box-shadow:0 0 8px #ff2d55, 0 0 2px #000 inset; }
  #led-col span { font-size:6px; color:#8d84a3; letter-spacing:.5px; writing-mode:vertical-rl; }
  #screen-out { flex:1; background:#0a0810; border-radius:4px; padding:4px; }
  canvas#screen {
    display:block; width:100%; aspect-ratio:160/144;
    image-rendering:pixelated; image-rendering:crisp-edges;
    background:#000;
  }
  #brand {
    text-align:center; margin:10px 0 6px;
    font-weight:bold; font-style:italic; font-size:15px; letter-spacing:1px;
    color:#c9c2da;
  }
  #brand b { color:#e0447f; }
  #brand small { font-size:9px; color:#8d84a3; font-style:normal; vertical-align:super; }

  /* ── controls ─────────────────────────────────────────────────────── */
  #controls { display:grid; grid-template-columns:1fr 1fr; align-items:center; padding:6px 2px 0; flex:1; min-height:130px; }
  /* D-pad */
  #dpad { position:relative; width:118px; height:118px; margin-left:6px; }
  .dbtn {
    position:absolute; width:40px; height:40px; background:linear-gradient(180deg,#211d2c,#141019);
    border:none; box-shadow:0 3px 0 #000, inset 0 1px 0 rgba(255,255,255,.15); cursor:pointer;
  }
  .dbtn:active,.dbtn.held { transform:translateY(2px); box-shadow:0 1px 0 #000, inset 0 1px 0 rgba(255,255,255,.1); }
  .dbtn::after { content:''; position:absolute; inset:12px; border-style:solid; border-color:transparent; }
  #d-up    { top:0;   left:39px; border-radius:6px 6px 0 0; }
  #d-down  { bottom:0;left:39px; border-radius:0 0 6px 6px; }
  #d-left  { left:0;  top:39px;  border-radius:6px 0 0 6px; }
  #d-right { right:0; top:39px;  border-radius:0 6px 6px 0; }
  #d-mid   { position:absolute; top:39px; left:39px; width:40px; height:40px; background:#1a1622; }
  #d-mid::after{ content:''; position:absolute; inset:10px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #2c2739, #100d16); }
  #d-up::after    { border-width:0 8px 10px 8px; border-bottom-color:#4a4258; top:9px; }
  #d-down::after  { border-width:10px 8px 0 8px; border-top-color:#4a4258; top:15px; }
  #d-left::after  { border-width:8px 10px 8px 0; border-right-color:#4a4258; left:9px; }
  #d-right::after { border-width:8px 0 8px 10px; border-left-color:#4a4258; left:15px; }
  /* A/B */
  #ab { display:flex; gap:16px; justify-self:end; margin-right:6px; transform:rotate(-22deg); }
  .rbtn {
    width:52px; height:52px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #f0619e, #b8226b 60%, #8a1750);
    border:none; box-shadow:0 4px 0 #560d31, inset 0 2px 2px rgba(255,255,255,.35); cursor:pointer;
    color:#fbd7e8; font-weight:bold; font-size:14px; font-family:monospace;
    display:flex; align-items:flex-end; justify-content:flex-end; padding:6px 10px;
  }
  .rbtn:active,.rbtn.held { transform:translateY(3px); box-shadow:0 1px 0 #560d31, inset 0 2px 2px rgba(255,255,255,.25); }
  #btn-b { margin-top:22px; }
  /* start/select */
  #pills { grid-column:1 / -1; display:flex; gap:22px; justify-content:center; padding:12px 0 2px; }
  .pill {
    width:58px; height:16px; border-radius:8px; border:none; cursor:pointer;
    background:linear-gradient(180deg,#211d2c,#141019); transform:rotate(-22deg);
    box-shadow:0 2px 0 #000, inset 0 1px 0 rgba(255,255,255,.15);
    position:relative;
  }
  .pill:active,.pill.held { transform:rotate(-22deg) translateY(2px); box-shadow:0 0 0 #000; }
  .pill span { position:absolute; top:19px; left:0; right:0; text-align:center; font-size:8px; letter-spacing:1px; color:#8d84a3; }
  /* speaker grille */
  #speaker { position:absolute; right:26px; bottom:20px; display:grid; grid-template-columns:repeat(6,6px); gap:7px; transform:rotate(-22deg); pointer-events:none; }
  #speaker i { width:6px; height:34px; border-radius:3px; background:#1a1622; box-shadow:inset 0 2px 3px rgba(0,0,0,.8); }
  #shell { position:relative; }

  /* Desktop: hint bar */
  #keys { text-align:center; font-size:9px; color:#6d6483; padding-top:8px; letter-spacing:.5px; display:none; }
  @media (hover:hover) and (pointer:fine) { #keys { display:block; } }

  /* Short screens: shrink controls */
  @media (max-height:640px) {
    #controls { min-height:104px; }
    #dpad { width:96px; height:96px; }
    .dbtn { width:32px; height:32px; } 
    #d-up,#d-down { left:32px; } #d-left,#d-right { top:32px; }
    #d-mid { top:32px; left:32px; width:32px; height:32px; }
    .rbtn { width:44px; height:44px; }
    #speaker { display:none; }
  }
</style>
</head>
<body>
<div id="shell">
  <div id="bezel">
    <div id="bezel-top"><div id="bezel-line"></div><span>DOT MATRIX WITH STEREO SOUND</span><div id="bezel-line"></div></div>
    <div id="screenwrap">
      <div id="led-col"><div id="led"></div><span>BATTERY</span></div>
      <div id="screen-out"><canvas id="screen" width="160" height="144"></canvas></div>
    </div>
  </div>
  <div id="brand">RÖKKET <b>BOY</b></div>
  <div id="controls">
    <div id="dpad">
      <button class="dbtn" id="d-up" data-k="up" aria-label="Up"></button>
      <button class="dbtn" id="d-left" data-k="left" aria-label="Left"></button>
      <div id="d-mid"></div>
      <button class="dbtn" id="d-right" data-k="right" aria-label="Right"></button>
      <button class="dbtn" id="d-down" data-k="down" aria-label="Down"></button>
    </div>
    <div id="ab">
      <button class="rbtn" id="btn-b" data-k="b" aria-label="B">B</button>
      <button class="rbtn" id="btn-a" data-k="a" aria-label="A">A</button>
    </div>
    <div id="pills">
      <button class="pill" data-k="select" aria-label="Select"><span>SELECT</span></button>
      <button class="pill" data-k="start" aria-label="Start"><span>START</span></button>
    </div>
  </div>
  <div id="speaker"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div id="keys">MOVE: ARROWS/WASD &nbsp; A: Z/SPACE &nbsp; B: X &nbsp; START: ENTER &nbsp; SELECT: SHIFT &nbsp; MUTE: M</div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
